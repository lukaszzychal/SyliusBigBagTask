name: End-to-End (MySQL)

on:
    workflow_dispatch: ~
    workflow_call:
        inputs:
            branch:
                description: "Branch"
                required: false
                type: string
                default: ""
            type:
                description: "Type of the build"
                required: true
                type: string

permissions:
    contents: read

jobs:
    get-matrix:
        runs-on: ubuntu-latest
        name: "Get matrix"
        outputs:
            matrix: ${{ steps.matrix.outputs.prop }}
        steps:
            -   name: "Checkout (With Branch)"
                if: "${{ inputs.branch != '' }}"
                uses: actions/checkout@v4
                with:
                    ref: ${{ inputs.branch }}

            -   name: "Checkout"
                uses: actions/checkout@v4
                if: "${{ inputs.branch == '' }}"

            -   name: "Get matrix"
                id: matrix
                uses: notiz-dev/github-action-json-property@release
                with:
                    path: '.github/workflows/matrix.json'
                    prop_path: '${{ inputs.type }}.e2e-mysql'

    behat-no-js:
        needs: get-matrix
        runs-on: ubuntu-latest
        name: "Non-JS, PHP ${{ matrix.php }}, Symfony ${{ matrix.symfony }} (${{ matrix.env || 'test_cached' }}), MySQL ${{ matrix.mysql }}, Twig ${{ matrix.twig }}"
        timeout-minutes: 15
        strategy:
            fail-fast: false
            matrix: ${{ fromJson(needs.get-matrix.outputs.matrix) }}

        env:
            APP_ENV: ${{ matrix.env || 'test_cached' }}
            DATABASE_URL: "mysql://root:root@127.0.0.1/sylius?charset=utf8mb4&serverVersion=${{ matrix.mysql }}"
            COMPOSER_IGNORE_PLATFORM_REQS: php

        steps:
            -   name: "Checkout (With Branch)"
                if: "${{ inputs.branch != '' }}"
                uses: actions/checkout@v4
                with:
                    ref: ${{ inputs.branch }}

            -   name: "Checkout"
                if: "${{ inputs.branch == '' }}"
                uses: actions/checkout@v4

            -   name: Prepare manifest.json files
                run: |
                    mkdir -p public/build/admin
                    mkdir -p public/build/shop
                    mkdir -p public/build/app/admin
                    mkdir -p public/build/app/shop
                    echo "{}" > public/build/admin/manifest.json
                    echo "{}" > public/build/shop/manifest.json
                    echo "{}" > public/build/app/admin/manifest.json
                    echo "{}" > public/build/app/shop/manifest.json

            -   name: Install Symfony CLI (pinned + fallbacks)
                run: |
                    set -euo pipefail
                    CLI_VERSION="5.9.1"
                    INSTALL_OK=0

                    # 1) Official installer with retries
                    for i in {1..5}; do
                      echo "Attempt $i: downloading installer..."
                      if curl -fsSL --retry 5 --retry-delay 5 --retry-connrefused https://get.symfony.com/cli/installer -o /tmp/symfony-installer; then
                        if bash /tmp/symfony-installer; then
                          INSTALL_OK=1
                          break
                        fi
                      fi
                      echo "Installer attempt $i failed, retrying..."
                      sleep 5
                    done

                    # 2) Pinned tarball fallback
                    if [ "$INSTALL_OK" -eq 0 ]; then
                      echo "Falling back to tarball v${CLI_VERSION}..."
                      for i in {1..5}; do
                        if curl -fL --retry 5 --retry-delay 5 --retry-connrefused \
                          "https://github.com/symfony-cli/symfony-cli/releases/download/v${CLI_VERSION}/symfony-cli_linux_amd64.tar.gz" \
                          -o /tmp/symfony-cli.tar.gz; then
                          if [ -s /tmp/symfony-cli.tar.gz ]; then
                            tar -xzf /tmp/symfony-cli.tar.gz -C /tmp symfony && sudo mv /tmp/symfony /usr/local/bin/symfony
                            sudo chmod +x /usr/local/bin/symfony
                            INSTALL_OK=1
                            break
                          fi
                        fi
                        echo "Tarball attempt $i failed, retrying..."
                        sleep 5
                      done
                    fi

                    # 3) Pinned deb fallback
                    if [ "$INSTALL_OK" -eq 0 ]; then
                      echo "Falling back to deb v${CLI_VERSION}..."
                      for i in {1..5}; do
                        if curl -fL --retry 5 --retry-delay 5 --retry-connrefused \
                          "https://github.com/symfony-cli/symfony-cli/releases/download/v${CLI_VERSION}/symfony-cli_linux_amd64.deb" \
                          -o /tmp/symfony-cli.deb; then
                          if [ -s /tmp/symfony-cli.deb ]; then
                            sudo apt-get update
                            sudo dpkg -i /tmp/symfony-cli.deb || sudo apt-get -f install -y
                            INSTALL_OK=1
                            break
                          fi
                        fi
                        echo "Deb attempt $i failed, retrying..."
                        sleep 5
                      done
                    fi

                    if [ "$INSTALL_OK" -ne 1 ] || ! command -v symfony >/dev/null 2>&1; then
                      echo "Symfony CLI installation failed after retries."
                      exit 1
                    fi

                    symfony version

            -   name: Build application
                uses: SyliusLabs/BuildTestAppAction@v3.1.0
                with:
                    build_type: "sylius"
                    cache_key: "${{ github.run_id }}-${{ runner.os }}-${{ hashFiles('composer.json') }}-symfony-${{ matrix.symfony }}"
                    cache_restore_key: "${{ github.run_id }}-${{ runner.os }}-${{ hashFiles('composer.json') }}-symfony-${{ matrix.symfony }}"
                    e2e: "yes"
                    e2e_js: "yes"
                    database_version: ${{ matrix.mysql }}
                    php_version: ${{ matrix.php }}
                    symfony_version: ${{ matrix.symfony }}
                    node_version: "20.x"
                    chrome_version: '137'

            -   name: Fix permissions for Symfony logs directory
                run: |
                    LOGS_DIR=$(bin/console debug:container --parameter=kernel.logs_dir | grep 'kernel.logs_dir' | awk '{print $2}')
                    mkdir -p "$LOGS_DIR"
                    chmod -R 777 "$LOGS_DIR"

            -   name: Test installer
                run: bin/console sylius:install --no-interaction -vvv

            -   name: Run PHPUnit
                run: vendor/bin/phpunit --colors=always
            
                
            # -   name: Run CLI Behat tests (smoke tests)
            #     run: vendor/bin/behat --colors --strict --no-interaction -v -f progress --tags="@cli&&~@todo" || vendor/bin/behat --strict --no-interaction -v -f progress --tags="@cli&&~@todo" --rerun

            -   name: Run Admin Notes Behat tests (non-JS)
                run: vendor/bin/behat --colors --strict --no-interaction -v -f progress --tags="@admin_notes&&~@javascript&&~@mink:chromedriver" || vendor/bin/behat --strict --no-interaction -v -f progress --tags="@admin_notes&&~@javascript&&~@mink:chromedriver" --rerun

            -   name: Run Shop Admin Notes Behat tests (non-JS)
                run: vendor/bin/behat --colors --strict --no-interaction -v -f progress --tags="@admin_notes_not_visible&&~@javascript&&~@mink:chromedriver" || vendor/bin/behat --strict --no-interaction -v -f progress --tags="@admin_notes_not_visible&&~@javascript&&~@mink:chromedriver" --rerun

            -   name: Upload logs
                uses: actions/upload-artifact@v4
                if: failure()
                with:
                    name: "Logs (non-JS, PHP ${{ matrix.php }}, Symfony ${{ matrix.symfony }}), Twig ${{ matrix.twig }}, MySQL ${{ matrix.mysql }} - ${{ github.run_id }}-${{ github.run_number }}"
                    path: |
                        etc/build/
                        var/log
                    if-no-files-found: ignore
                    overwrite: true

    behat-ui-js-chromedriver:
        needs: get-matrix
        runs-on: ubuntu-latest
        name: "JS with Chromedriver, PHP ${{ matrix.php }}, Symfony ${{ matrix.symfony }} (${{ matrix.env || 'test_cached' }}), MySQL ${{ matrix.mysql }}, Twig ${{ matrix.twig }}"
        timeout-minutes: 15
        strategy:
            fail-fast: false
            matrix: ${{ fromJson(needs.get-matrix.outputs.matrix) }}

        env:
            APP_ENV: ${{ matrix.env || 'test_cached' }}
            DATABASE_URL: "mysql://root:root@127.0.0.1/sylius?charset=utf8mb4&serverVersion=${{ matrix.mysql }}"
            COMPOSER_IGNORE_PLATFORM_REQS: php

        steps:
            -   name: "Checkout (With Branch)"
                if: "${{ inputs.branch != '' }}"
                uses: actions/checkout@v4
                with:
                    ref: ${{ inputs.branch }}

            -   name: "Checkout"
                if: "${{ inputs.branch == '' }}"
                uses: actions/checkout@v4

            -   name: Get Composer cache directory
                id: composer-cache
                run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

            -   name: "Restore dependencies"
                uses: actions/cache@v4
                with:
                    path: ${{ steps.composer-cache.outputs.dir }}
                    key: "${{ github.run_id }}-${{ runner.os }}-${{ hashFiles('composer.json') }}-symfony-${{ matrix.symfony }}"
                    restore-keys: "${{ github.run_id }}-${{ runner.os }}-${{ hashFiles('composer.json') }}-symfony-${{ matrix.symfony }}"

            -   name: Cache node_modules
                uses: actions/cache@v4
                with:
                    path: |
                        node_modules
                        ~/.npm
                    key: ${{ runner.os }}-node-${{ hashFiles('package.json', 'yarn.lock') }}
                    restore-keys: |
                        ${{ runner.os }}-node-

            -   name: Restrict Twig
                if: matrix.twig == '^2.12'
                run: composer require --no-update --no-scripts --no-interaction "twig/twig:${{ matrix.twig }}"

            -   name: Install Symfony CLI (pinned + fallbacks)
